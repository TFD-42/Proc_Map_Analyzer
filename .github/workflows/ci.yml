name: CI

# No unit test suite or linter configured yet
# (see CONTRIBUTING.md and ENRICHMENT_PLAN.md, item 14) — this CI therefore
# deliberately does what actually exists today: a syntax check
# (py_compile) on the two Python scripts, then a real end-to-end run
# (collection, graph, HTML rendering) with no dependency on Ollama or a
# graphical display. To be enriched with pytest / ruff as soon as they
# actually exist in the project, rather than faking them here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile process_analyzer_allinone.py
          python -m py_compile process_graph_analyzer.py

      - name: Real end-to-end run (no Ollama, no PNG)
        run: |
          python process_analyzer_allinone.py \
            --no-enrich \
            --max-processes 30 \
            --html-output /tmp/ci_smoke_test.html
          test -s /tmp/ci_smoke_test.html
