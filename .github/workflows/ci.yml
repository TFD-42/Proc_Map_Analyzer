name: CI

# No unit test suite or linter configured yet
# (see CONTRIBUTING.md and ENRICHMENT_PLAN.md, item 14) — this CI therefore
# deliberately does what actually exists today: a syntax check
# (py_compile) on the Python script, then a real end-to-end run
# (collection, graph, HTML rendering) with no dependency on Ollama or a
# graphical display. To be enriched with pytest / ruff as soon as they
# actually exist in the project, rather than faking them here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (main script + plugins, in memory)
        run: python compile_check.py

      - name: Real end-to-end run (no Ollama, no PNG)
        run: |
          python process_analyzer_allinone.py \
            --no-enrich \
            --max-processes 30 \
            --html-output /tmp/ci_smoke_test.html
          test -s /tmp/ci_smoke_test.html

  install-scripts:
    # Exercises install.sh / reinstall.sh / build.sh exactly as a user would,
    # on an isolated copy: pinned deps, compile check, PyInstaller build and
    # a real run of the built executable (see tests/test_install_scripts.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install/reinstall/build harness
        run: tests/test_install_scripts.sh --with-build
