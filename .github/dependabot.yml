version: 2
updates:
  # pip: version bumps re-enabled in v0.3.0 after dropping Python 3.9
  # support (requests>=2.33, matplotlib>=3.10, and networkx>=3.3 all
  # require Python >= 3.10 — this used to make Dependabot's version-bump
  # PRs #3/#4/#5 fail CI on 3.9, hence the open-pull-requests-limit: 0
  # below at the time; the project's floor is now Python 3.10, see
  # CHANGELOG.md, so plain version bumps are safe again).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
